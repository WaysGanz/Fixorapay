
name: Generate Initial Prisma Migration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate initial migration
        run: |
          mkdir -p prisma/migrations/20261107000000_init

          npx --yes prisma@6.19.0 migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script \
            > prisma/migrations/20261107000000_init/migration.sql

          echo 'provider = "postgresql"' \
            > prisma/migrations/migration_lock.toml

      - name: Commit migration to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add prisma/migrations/

          if ! git diff --cached --quiet; then
            git commit -m "Add initial Prisma migration"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "No migration changes."
          fi
